name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback: everything that needs no browser, no build and no network.
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Runs against the source tree. The built output is checked separately in
      # the `build` job, because a name can leak through a generated file that
      # does not exist yet at this point.
      - name: Check for unpublishable names in source
        run: pnpm check:stealth

  build:
    name: Build and verify output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check for unpublishable names in built output
        run: node scripts/check-stealth.mjs dist

      - name: Check internal links
        run: pnpm check:links

      # A social image is only ever seen inside somebody else's crop. LinkedIn's
      # mobile Featured card is the tightest one measured — it throws away 13%
      # of the width — and the padding used to be exactly what it removed, so
      # every image shipped with its text shaved and nothing noticed.
      - name: Check social images survive the crop
        run: pnpm check:og

      # The site ships no framework runtime by design. This is the assertion
      # that keeps it true — an accidental client-side component import would
      # otherwise pass every other check in this file.
      - name: Assert no client-side framework shipped
        run: |
          if grep -rqiE 'react-dom|createElement|__vite__|hydrate' dist --include='*.html' --include='*.js'; then
            echo "::error::A client-side framework runtime reached dist/."
            exit 1
          fi
          echo "No framework runtime in dist/."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: axe, keyboard and mobile-layout tests, both themes
        run: pnpm test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      # Use the browser Playwright already pinned rather than whatever Chrome
      # the runner image happens to carry, so a runner image update cannot
      # move the performance numbers on its own.
      - name: Resolve Chrome
        run: |
          echo "CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Assert Lighthouse budgets
        run: pnpm exec lhci autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
